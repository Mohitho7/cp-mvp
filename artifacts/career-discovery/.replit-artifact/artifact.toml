kind = "web"
previewPath = "/"
title = "Career Discovery"
version = "1.0.0"
id = "artifacts/career-discovery"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22230

[services.development]
run = "pnpm --filter @workspace/career-discovery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/career-discovery", "run", "build" ]
publicDir = "artifacts/career-discovery/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22230"
BASE_PATH = "/"
