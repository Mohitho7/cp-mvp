openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: career-discovery
    description: Career assessment submissions, private student reports, and institution summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /submissions:
    post:
      operationId: createCareerSubmission
      tags: [career-discovery]
      summary: Save a student's answers and queue a report
      description: Requires an authenticated student and explicit consent to share aggregate assessment data with their institution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerSubmissionInput"
      responses:
        "201":
          description: Submission saved and report queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerSubmissionAccepted"
        "400":
          description: Answers or consent are invalid
        "401":
          description: Sign in required
        "409":
          description: This student already has a submission
        "429":
          description: Too many submission attempts
        "503":
          description: Institution setup is incomplete
  /submit:
    post:
      operationId: submitCareerAssessment
      tags: [career-discovery]
      summary: Save a student's answers and queue a report
      description: Compatibility alias for POST /submissions. Requires an authenticated student and explicit consent to share aggregate assessment data with their institution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerSubmissionInput"
      responses:
        "201":
          description: Submission saved and report queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerSubmissionAccepted"
        "400":
          description: Answers or consent are invalid
        "401":
          description: Sign in required
        "409":
          description: This student already has a submission
        "429":
          description: Too many submission attempts
        "503":
          description: Institution setup is incomplete
  /submissions/me:
    get:
      operationId: getMyCareerSubmission
      tags: [career-discovery]
      summary: Get the signed-in student's current submission
      description: Returns only the current student's own submission and report.
      responses:
        "200":
          description: Current student's submission status and report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerSubmissionResult"
        "401":
          description: Sign in required
        "404":
          description: No assessment has been submitted
  /submissions/{id}:
    get:
      operationId: getCareerSubmission
      tags: [career-discovery]
      summary: Get the signed-in student's submission status and report
      description: Students can read only their own report.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Submission status, with a report when generation is complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerSubmissionResult"
        "401":
          description: Sign in required
        "404":
          description: Submission not found or does not belong to the signed-in student
  /submissions/{id}/retry:
    post:
      operationId: retryCareerSubmission
      tags: [career-discovery]
      summary: Retry a failed report generation
      description: The owning student can queue a failed submission for another set of generation attempts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Report generation queued again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerSubmissionAccepted"
        "401":
          description: Sign in required
        "404":
          description: Submission not found or does not belong to the signed-in student
        "409":
          description: Only failed submissions can be retried
  /submissions/{id}/feedback:
    get:
      operationId: getCareerFeedback
      tags: [career-discovery]
      summary: Get the student's saved feedback for this submission
      description: Returns the rating and optional comment for the student's completed report.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved feedback or null if none submitted yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerFeedbackResponse"
        "401":
          description: Sign in required
        "404":
          description: Submission not found or does not belong to the signed-in student
    post:
      operationId: submitCareerFeedback
      tags: [career-discovery]
      summary: Submit or update feedback for a completed report
      description: Saves or updates the 1-5 star rating and optional comment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerFeedbackInput"
      responses:
        "200":
          description: Feedback saved or updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerFeedbackResponse"
        "400":
          description: Invalid rating or oversized comment
        "401":
          description: Sign in required
        "404":
          description: Submission not found or does not belong to the signed-in student
  /result/{id}:
    get:
      operationId: getCareerResult
      tags: [career-discovery]
      summary: Get the signed-in student's submission status and report
      description: Compatibility alias for GET /submissions/{id}. Students can read only their own report.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Submission status, with a report when generation is complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerSubmissionResult"
        "401":
          description: Sign in required
        "404":
          description: Submission not found or does not belong to the signed-in student
  /dashboard:
    get:
      operationId: getInstitutionDashboard
      tags: [career-discovery]
      summary: Get aggregated career assessment insights
      description: Institution administrators only. Returns cohort aggregates and never individual student reports or identity.
      parameters:
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: year
          in: query
          required: false
          schema:
            type: string
        - name: batch
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Aggregated cohort insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionDashboard"
        "401":
          description: Sign in required
        "403":
          description: Institution administrator access required
        "503":
          description: Institution administrator access is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CareerAnswerValue:
      oneOf:
        - type: string
        - type: array
          items:
            type: string
        - type: "null"
    CareerSubmissionInput:
      type: object
      properties:
        answers:
          type: object
          properties:
            q1:
              $ref: "#/components/schemas/CareerAnswerValue"
            q2:
              $ref: "#/components/schemas/CareerAnswerValue"
            q3:
              $ref: "#/components/schemas/CareerAnswerValue"
            q4:
              $ref: "#/components/schemas/CareerAnswerValue"
            q5:
              $ref: "#/components/schemas/CareerAnswerValue"
            q6:
              $ref: "#/components/schemas/CareerAnswerValue"
            q7:
              $ref: "#/components/schemas/CareerAnswerValue"
            q8:
              $ref: "#/components/schemas/CareerAnswerValue"
            q9:
              $ref: "#/components/schemas/CareerAnswerValue"
            q10:
              $ref: "#/components/schemas/CareerAnswerValue"
            q11:
              $ref: "#/components/schemas/CareerAnswerValue"
            q12:
              $ref: "#/components/schemas/CareerAnswerValue"
            q13:
              type: string
              maxLength: 2000
          required: [q1, q2, q3, q4, q5, q6, q7, q8, q9, q10, q11, q12, q13]
          additionalProperties: false
        department:
          type: string
          maxLength: 120
        year:
          type: string
          maxLength: 40
        batch:
          type: string
          maxLength: 40
        degree:
          type: string
          maxLength: 100
          description: Student's degree/programme as free text.
        graduationYear:
          type: integer
          description: Expected graduation year (validated server-side against a dynamic window).
        availableHoursPerWeek:
          type: integer
          minimum: 1
          maximum: 60
          description: Realistic weekly hours the student can dedicate to career preparation.
        consent:
          type: boolean
          const: true
      required: [answers, department, year, batch, degree, graduationYear, availableHoursPerWeek, consent]
      additionalProperties: false
    CareerSubmissionAccepted:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        submittedAt:
          type: string
          format: date-time
      required: [id, status, submittedAt]
    TraitScore:
      type: object
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        reason:
          type: string
          maxLength: 250
        label:
          type: string
          enum: [Low, Medium, High]
      required: [score, reason, label]
    CareerProfile:
      type: object
      properties:
        archetype:
          type: string
          maxLength: 80
        workerType:
          type: string
          enum:
            [
              Specialist,
              Operator,
              Builder,
              Analyst,
              Communicator,
              Entrepreneur,
              Manager,
            ]
        clarityLevel:
          type: string
          enum: [Clear, Mixed, Exploratory]
        summary:
          type: string
          maxLength: 350
        strengths:
          type: array
          minItems: 2
          maxItems: 3
          items:
            type: string
            maxLength: 250
        risks:
          type: array
          minItems: 2
          maxItems: 3
          items:
            type: string
            maxLength: 250
        survivalEnvironment:
          type: string
          maxLength: 300
      required:
        [
          archetype,
          workerType,
          clarityLevel,
          summary,
          strengths,
          risks,
          survivalEnvironment,
        ]
    CareerTraits:
      type: object
      properties:
        technical:
          $ref: "#/components/schemas/TraitScore"
        creative:
          $ref: "#/components/schemas/TraitScore"
        people:
          $ref: "#/components/schemas/TraitScore"
        risk:
          $ref: "#/components/schemas/TraitScore"
        learning:
          $ref: "#/components/schemas/TraitScore"
      required: [technical, creative, people, risk, learning]
    AnswerConflict:
      type: object
      properties:
        tag:
          type: string
          maxLength: 60
        text:
          type: string
          maxLength: 300
      required: [tag, text]
    AnswerPatterns:
      type: object
      properties:
        clear:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 250
        conflicts:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AnswerConflict"
        worthExploring:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 250
      required: [clear, conflicts, worthExploring]
    CaliberVsEntry:
      type: object
      properties:
        longTermCaliber:
          type: string
          maxLength: 350
        marketBarrier:
          type: string
          maxLength: 350
        marketBarrierLevel:
          type: string
          enum: [Low, Moderate, High]
        firstEntryRoles:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            maxLength: 100
        bridgePath:
          type: string
          maxLength: 350
      required:
        [
          longTermCaliber,
          marketBarrier,
          marketBarrierLevel,
          firstEntryRoles,
          bridgePath,
        ]
    SalaryRange:
      type: object
      properties:
        min:
          type: number
          minimum: 0
          maximum: 100
        max:
          type: number
          minimum: 0
          maximum: 100
      required: [min, max]
    CareerFit:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        roleType:
          type: string
          enum: [Stepping-stone, Long-term fit]
        salaryInrLpa:
          anyOf:
            - $ref: "#/components/schemas/SalaryRange"
            - type: "null"
        entryDifficulty:
          type: string
          enum: [Easy to enter, Moderately difficult, Highly competitive]
        careerHealth:
          type: string
          enum: [Stable, Fast-growth, High burnout, Oversaturated, High leverage]
        aiThreat:
          type: string
          enum: [Low, Medium, High]
        naturalFitScore:
          type: integer
          minimum: 1
          maximum: 10
        dailyWork:
          type: string
          maxLength: 300
        whyFits:
          type: string
          maxLength: 300
        fiveYearGrowth:
          type: string
          maxLength: 300
      required:
        [
          title,
          roleType,
          salaryInrLpa,
          entryDifficulty,
          careerHealth,
          aiThreat,
          naturalFitScore,
          dailyWork,
          whyFits,
          fiveYearGrowth,
        ]
    CareerToAvoid:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        why:
          type: string
          maxLength: 300
      required: [title, why]
    TrackDetail:
      type: object
      properties:
        why:
          type: string
          maxLength: 350
        fresherDemand:
          type: string
          maxLength: 150
        skillsToLearn:
          type: array
          minItems: 4
          maxItems: 8
          items:
            type: string
            maxLength: 80
      required: [why, fresherDemand, skillsToLearn]
    RoadmapStep:
      type: object
      properties:
        months:
          type: string
          maxLength: 20
        focus:
          type: string
          maxLength: 120
        actions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            maxLength: 200
      required: [months, focus, actions]
    LongTermCareerOption:
      type: object
      properties:
        id:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 100
        rank:
          type: integer
          minimum: 1
          maximum: 5
        score:
          type: number
        fitScore:
          type: number
        rationale:
          type: string
          maxLength: 500
      required: [id, title, category, rank, score, fitScore, rationale]
      additionalProperties: false
    EntryLevelCareerOption:
      type: object
      properties:
        id:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 100
        rank:
          type: integer
          minimum: 1
          maximum: 5
        score:
          type: number
        fitScore:
          type: number
        rationale:
          type: string
          maxLength: 500
        accessibility:
          type: string
          enum: [VERY_HIGH, HIGH, MEDIUM, MODERATE, LOW, VERY_LOW]
        alignment:
          type: string
          enum: [STRONG, MODERATE, NEUTRAL, WEAK]
        runwayWeeks:
          type: number
      required:
        [
          id,
          title,
          category,
          rank,
          score,
          fitScore,
          rationale,
          accessibility,
          alignment,
          runwayWeeks,
        ]
      additionalProperties: false
    ComparisonRoleItem:
      type: object
      properties:
        id:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 120
        roleInvolves:
          type: string
          maxLength: 500
        whyFit:
          type: string
          maxLength: 500
        tradeOff:
          type: string
          maxLength: 500
        differentiation:
          type: string
          maxLength: 500
      required: [id, title, roleInvolves, whyFit, tradeOff, differentiation]
      additionalProperties: false
    CareerComparison:
      type: object
      properties:
        longTerm:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/ComparisonRoleItem"
        entryLevel:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/ComparisonRoleItem"
      required: [longTerm, entryLevel]
      additionalProperties: false
    WorkLaneEntryRoute:
      type: object
      properties:
        routeType:
          type: string
          enum: [DIRECT, ADJACENT, BRIDGE]
        entryCareer:
          $ref: "#/components/schemas/CareerReference"
        bridgeCareer:
          anyOf:
            - $ref: "#/components/schemas/CareerReference"
            - type: "null"
        rationale:
          type: string
          maxLength: 500
      required: [routeType, entryCareer, bridgeCareer, rationale]
      additionalProperties: false
    WorkLaneRecommendation:
      type: object
      properties:
        lane:
          type: string
          enum:
            [
              Engineering,
              Product,
              Automation,
              "Startup Ops",
              "Technical Business",
              "Design / UI-UX",
              "Hybrid Tech-Generalist",
            ]
        why:
          type: string
          maxLength: 500
        primaryCareer:
          $ref: "#/components/schemas/CareerReference"
        supportingCareers:
          type: array
          items:
            $ref: "#/components/schemas/CareerReference"
        entryRoute:
          $ref: "#/components/schemas/WorkLaneEntryRoute"
        explanation:
          type: string
          maxLength: 600
      required:
        [
          lane,
          why,
          primaryCareer,
          supportingCareers,
          entryRoute,
          explanation,
        ]
      additionalProperties: false
    RoadmapMilestone:
      type: object
      properties:
        order:
          type: integer
          minimum: 1
          maximum: 5
        monthRange:
          type: string
          maxLength: 40
        focus:
          type: string
          maxLength: 160
        actions:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            maxLength: 250
        measurableOutputs:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            maxLength: 250
      required: [order, monthRange, focus, actions, measurableOutputs]
      additionalProperties: false
    MentorNote:
      type: object
      properties:
        observedPattern:
          type: string
          maxLength: 500
        realisticRisk:
          type: string
          maxLength: 500
        actionableExperiment:
          type: string
          maxLength: 500
      required: [observedPattern, realisticRisk, actionableExperiment]
      additionalProperties: false
    CareerReport:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/CareerProfile"
        traits:
          $ref: "#/components/schemas/CareerTraits"
        answerPatterns:
          $ref: "#/components/schemas/AnswerPatterns"
        caliberVsEntry:
          $ref: "#/components/schemas/CaliberVsEntry"
        workArchetype:
          anyOf:
            - $ref: "#/components/schemas/WorkArchetype"
            - type: "null"
          description: Deterministic work archetype set by the server for new reports; absent in legacy reports.
        careerDirection:
          anyOf:
            - $ref: "#/components/schemas/CareerDirection"
            - type: "null"
          description: Deterministic career direction composed by the server for new reports; absent in legacy reports.
        longTermOptions:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/LongTermCareerOption"
        entryOptions:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/EntryLevelCareerOption"
        careerComparison:
          $ref: "#/components/schemas/CareerComparison"
        recommendedWorkLane:
          $ref: "#/components/schemas/WorkLaneRecommendation"
        roadmap:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/RoadmapMilestone"
        mentorNote:
          $ref: "#/components/schemas/MentorNote"
        recommendedTrack:
          type: string
          enum:
            [
              Engineering,
              Product,
              Automation,
              "Startup Ops",
              "Technical Business",
              "Design / UI-UX",
              "Hybrid Tech-Generalist",
            ]
      required:
        [
          profile,
          traits,
          answerPatterns,
          caliberVsEntry,
          workArchetype,
          careerDirection,
          longTermOptions,
          entryOptions,
          careerComparison,
          recommendedWorkLane,
          roadmap,
          mentorNote,
          recommendedTrack,
        ]
      additionalProperties: false
    LegacyCareerReport:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/CareerProfile"
        traits:
          $ref: "#/components/schemas/CareerTraits"
        answerPatterns:
          $ref: "#/components/schemas/AnswerPatterns"
        caliberVsEntry:
          $ref: "#/components/schemas/CaliberVsEntry"
        careerFits:
          type: array
          minItems: 4
          maxItems: 6
          items:
            $ref: "#/components/schemas/CareerFit"
        careersToAvoid:
          type: array
          items:
            $ref: "#/components/schemas/CareerToAvoid"
        recommendedTrack:
          type: string
          enum:
            [
              Engineering,
              Product,
              Automation,
              "Startup Ops",
              "Technical Business",
              "Design / UI-UX",
              "Hybrid Tech-Generalist",
            ]
        trackDetail:
          $ref: "#/components/schemas/TrackDetail"
        roadmap:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/RoadmapStep"
        brutalTruth:
          type: string
          maxLength: 500
        workArchetype:
          anyOf:
            - $ref: "#/components/schemas/WorkArchetype"
            - type: "null"
        careerDirection:
          anyOf:
            - $ref: "#/components/schemas/CareerDirection"
            - type: "null"
        careerComparison:
          anyOf:
            - type: array
              minItems: 1
              maxItems: 8
              items:
                $ref: "#/components/schemas/CareerComparisonItem"
            - type: "null"
        skillsGaps:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/SkillsGap"
            - type: "null"
      required:
        [
          profile,
          traits,
          answerPatterns,
          caliberVsEntry,
          careerFits,
          careersToAvoid,
          recommendedTrack,
          trackDetail,
          roadmap,
          brutalTruth,
        ]
    WorkArchetype:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
        definition:
          type: string
          maxLength: 300
        strength:
          type: string
          enum: [Strong, Moderate, Emerging]
        evidence:
          type: array
          maxItems: 3
          items:
            type: string
            maxLength: 120
      required: [name, definition, strength, evidence]
      additionalProperties: false
    CareerDirectionRole:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        why:
          type: string
          maxLength: 500
      required: [title, why]
      additionalProperties: false
    CareerDirection:
      type: object
      properties:
        target:
          $ref: "#/components/schemas/CareerDirectionRole"
        entry:
          $ref: "#/components/schemas/CareerDirectionRole"
        route:
          type: string
          enum: [DIRECT, ADJACENT, BRIDGE]
        routeWhy:
          type: string
          maxLength: 500
        barriers:
          type: array
          items:
            type: string
            maxLength: 300
        alternativesNote:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
      required: [target, entry, route, routeWhy, barriers, alternativesNote]
      additionalProperties: false
    CareerComparisonItem:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        role:
          type: string
          enum: [target, entry, alternative, exploratory, cautious]
        rationale:
          type: string
          maxLength: 500
        skillsToDevelop:
          type: array
          items:
            type: string
            maxLength: 80
        entryDifficulty:
          anyOf:
            - type: string
              maxLength: 60
            - type: "null"
        prerequisites:
          anyOf:
            - type: string
              maxLength: 300
            - type: "null"
      required: [title, role, rationale, skillsToDevelop, entryDifficulty, prerequisites]
      additionalProperties: false
    SkillsGap:
      type: object
      properties:
        skill:
          type: string
          maxLength: 80
        whyItMatters:
          type: string
          maxLength: 300
        activity:
